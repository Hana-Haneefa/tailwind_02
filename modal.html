<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Model page</title>
    <link rel="stylesheet" href="./src/index.css" />
  </head>
  <body>
    <div class="w-full h-screen inline-block bg-gray-200">
      <div
        class="container flex flex-col justify-center items-center mx-auto h-100 md:w-250 mt-10"
      >
        <div class="sec1 flex justify-center items-center flex-col mb-10">
          <h1 class="text-3xl font-bold pb-3 text-center">
            Model Component Demo
          </h1>
          <p class="text-gray-500 text-center">
            Click the buttons below to open different types of modals
          </p>
        </div>
        <div
          class="sec2 flex space-x-6 md:flex-row flex-col md:gap-3 gap-4 w-full md:justify-center justify-items-center p-6 rounded-lg"
        >
          <div
            class="div1 bg-blue-600 md:w-60 h-15 rounded-lg py-1.5 px-3 text-center text-white cursor-pointer hover:bg-blue-800 transition duration-300 flex items-center justify-center text-lg font-medium hover:scale-105 w-full"
          >
            Open Info Modal
          </div>

          <div
            class="div2 bg-green-600 md:w-60 h-15 rounded-lg py-1.5 px-3 text-center text-white cursor-pointer hover:bg-green-800 transition duration-300 flex items-center justify-center text-lg font-medium hover:scale-105 w-full"
          >
            Open Form Modal
          </div>

          <div
            class="div3 bg-purple-600 md:w-60 h-15 rounded-lg py-1.5 px-3 text-center text-white cursor-pointer hover:bg-purple-800 transition duration-300 flex items-center justify-center text-lg font-medium hover:scale-105 w-full"
          >
            Open Confirmation
          </div>
        </div>
      </div>
    </div>

    <!-- Info modal -->
  </body>
</html>
